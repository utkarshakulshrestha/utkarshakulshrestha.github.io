baseURL: https://utkarshakulshrestha.github.io

languageCode: en-us
title: "Utkarsha Kulshrestha"

# Use Hugo modules to add theme
module:
  imports:
    - path: github.com/hugo-toha/toha/v4
  mounts:
    - source: ./node_modules/flag-icons/flags
      target: static/flags
    - source: ./node_modules/@fontsource/mulish/files
      target: static/files
    - source: ./node_modules/katex/dist/fonts
      target: static/fonts

# Manage languages
languages:
  en:
    languageName: English
    weight: 1

# Allow raw html in markdown file
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false

# At least HTML and JSON are required for the main HTML content and
# client-side JavaScript search
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Enable global emoji support
enableEmoji: true

# Configure sitemap
sitemap:
  changefreq: monthly
  priority: 0.5
  filename: sitemap.xml

# Site parameters
params:
  # Background image of the landing page (optional - leave empty for default)
  background: images/site/background.jpg

  # Provide logos for your site (paths relative to assets folder)
  logo:
    main: images/site/main-logo.png
    inverted: images/site/inverted-logo.png
    favicon: images/site/favicon.png

  # GitHub repo of your site
  gitRepo: https://github.com/utkarshakulshrestha/utkarshakulshrestha.github.io
  gitBranch: main

  # Configure the number of section title visible in the top navbar
  topNavbar:
    maxVisibleSections: 6

  # Configure various features of this theme
  features:
    # Enable dark theme
    darkMode:
      enable: true

    # Enable and configure portfolio
    portfolio:
      enable: true

    # Enable and configure blog posts
    blog:
      enable: true
      shareButtons:
        facebook: true
        twitter: true
        linkedin: true
        reddit: false
        whatsapp: true
        email: true

    # Enable comment feature
    comment:
      enable: false

    # Enable Analytics (configure with your own ID)
    analytics:
      enabled: false

    # Enable Support
    support:
      enable: false

    # specify whether you want to show Table of Contents in reading page
    toc:
      enable: true

    # Show tags under the post title
    tags:
      enable: true

    # Specify whether to show flag in the language selector
    flags:
      enable: false

    # Enable reading time support in post cards and in post pages
    readingTime:
      enable: true

  # Provide footer configuration
  footer:
    enable: true
    navigation:
      enable: true
      customMenus: false
    contactMe:
      enable: true
    credentials:
      enable: true
    newsletter:
      enable: false
    disclaimer:
      enable: false
